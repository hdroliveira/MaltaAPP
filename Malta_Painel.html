<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malta+ — Social Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0b0c10; --surface:#15171f; --surface-2:#1c1f2a; --surface-3:#262a38;
    --border:#2a2e3d; --border-soft:#20232e;
    --text:#eef0f6; --muted:#9096a8; --muted-2:#5f6478;
    --accent:#7c8cf8; --accent-2:#a06ef0; --accent-dim:#3d4270; --accent-ghost:rgba(124,140,248,.14);
    --accent-grad:linear-gradient(135deg,var(--accent),var(--accent-2));
    --danger:#e5698a; --ok:#5fd0a0; --warn:#e6b45f;
    --radius:13px; --radius-sm:9px;
    --sans:'Inter',-apple-system,system-ui,sans-serif;
    --display:'Space Grotesk','Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 520px at 14% -8%, rgba(124,140,248,.10), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(160,110,240,.07), transparent 55%),
      var(--bg);
    color:var(--text);font-family:var(--sans);
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    display:flex;min-height:100vh;overflow-x:hidden;
  }
  ::selection{background:var(--accent-ghost);color:var(--text)}
  button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
  input,textarea,select{font-family:inherit;color:var(--text);background:var(--surface-2);
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;outline:none;width:100%;transition:.12s}
  input:focus,textarea:focus,select:focus{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-ghost)}
  input::placeholder,textarea::placeholder{color:var(--muted-2)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- Sidebar ---------- */
  .rail{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  .brand{padding:22px 18px 18px;display:flex;align-items:center;gap:11px}
  .brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent-grad);
    display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 14px -4px rgba(124,140,248,.55)}
  .brand .mark span{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
  .brand h1{font-family:var(--display);font-size:16.5px;font-weight:700;letter-spacing:-.01em;line-height:1.15;
    background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--accent)}
  .brand h1 small{display:block;font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
    -webkit-text-fill-color:var(--muted);color:var(--muted)}

  .nav{padding:6px 10px;display:flex;flex-direction:column;gap:1px}
  .nav-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);
    padding:14px 8px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--radius-sm);
    color:var(--muted);font-weight:500;font-size:13.5px;text-align:left;width:100%;transition:.12s}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--accent-ghost);color:var(--text)}
  .nav-item.active .ic{color:var(--accent)}
  .nav-item .ic{width:17px;height:17px;flex-shrink:0;color:var(--muted-2);transition:.12s}
  .nav-item .badge{margin-left:auto;font-size:11px;background:var(--surface-3);color:var(--muted);
    padding:1px 7px;border-radius:20px;font-variant-numeric:tabular-nums}

  .rail-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border-soft)}
  .rail-foot button{width:100%;font-size:12px;color:var(--muted);padding:8px;border-radius:var(--radius-sm);text-align:left}
  .rail-foot button:hover{background:var(--surface-2);color:var(--text)}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .topbar{padding:16px 26px 0;display:flex;flex-direction:column;gap:14px;flex-shrink:0}
  .topbar-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .section-title{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.02em}
  .section-sub{color:var(--muted);font-size:13px;margin-top:2px}
  .clock{margin-left:auto;text-align:right;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
  .clock b{display:block;color:var(--text);font-size:13.5px;font-weight:500;text-transform:capitalize}

  /* client filter pills */
  .clients{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--border-soft)}
  .cpill{display:flex;align-items:center;gap:8px;padding:5px 13px 5px 6px;border-radius:20px;
    background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:500;color:var(--muted);transition:.12s;white-space:nowrap}
  .cpill:hover{border-color:var(--accent-dim);color:var(--text)}
  .cpill.active{background:var(--surface-2);color:var(--text);border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-ghost)}
  .cpill .dot{width:20px;height:20px;border-radius:50%;flex-shrink:0}
  .cpill.add{color:var(--muted-2);border-style:dashed;padding:5px 13px}
  .cpill.add:hover{color:var(--accent);border-color:var(--accent-dim)}

  /* ---------- Client directory ---------- */
  .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.16);transition:.14s;cursor:pointer}
  .client-card:hover{border-color:var(--accent-dim);transform:translateY(-2px)}
  .ccard-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:11px}
  .ccard-id{flex:1;min-width:0}
  .ccard-name{font-size:14.5px;font-weight:600;color:#fff}
  .ccard-obj{font-size:11.5px;color:var(--accent);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ccard-desc{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:11px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .ccard-palette{display:flex;gap:5px;margin-bottom:11px}
  .pal-sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
  .ccard-foot{display:flex;flex-wrap:wrap;gap:6px}
  .ccard-chip{font-size:10.5px;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:20px;white-space:nowrap}

  /* ---------- Client read-only view modal ---------- */
  .view-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .view-obj{font-size:12.5px;color:var(--accent);margin-top:3px}
  .view-text{font-size:13px;color:var(--muted);line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .view-list{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:7px}
  .view-list b{color:var(--text);font-weight:600;margin-right:4px}
  .cred-view-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px}
  .cred-view-row:last-child{border-bottom:none}
  .cv-label{font-weight:600;color:var(--text);min-width:110px;flex-shrink:0}
  .cv-user{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cv-pass{color:var(--muted);font-variant-numeric:tabular-nums;min-width:90px}

  .content{flex:1;overflow-y:auto;padding:20px 26px 40px}
  .view{display:none;animation:fade .25s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* generic bits */
  .row-add{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .row-add input{flex:1;min-width:160px}
  .row-add select{width:auto;min-width:120px}
  .btn{background:var(--accent-grad);color:#0d0e12;font-weight:600;font-size:13px;padding:9px 16px;border-radius:var(--radius-sm);
    white-space:nowrap;transition:.14s;box-shadow:0 3px 12px -4px rgba(124,140,248,.45)}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 16px -4px rgba(124,140,248,.55)}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);box-shadow:none}
  .btn.ghost:hover{border-color:var(--accent-dim);transform:none}
  .btn.sm{padding:6px 11px;font-size:12px}
  .empty{color:var(--muted-2);font-size:13px;text-align:center;padding:44px 20px;
    border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface)}
  .empty b{display:block;color:var(--muted);font-size:14px;margin-bottom:4px;font-weight:600}
  .ctag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
    padding:2px 9px 2px 2px;border-radius:20px;background:var(--surface-2);white-space:nowrap;border:1px solid var(--border-soft)}
  .ctag .dot{width:7px;height:7px;border-radius:50%}
  .iconbtn{color:var(--muted-2);padding:5px;border-radius:6px;display:grid;place-items:center;transition:.12s}
  .iconbtn:hover{background:var(--surface-3);color:var(--text)}
  .iconbtn.del:hover{color:var(--danger)}
  .iconbtn.edit:hover{color:var(--accent)}

  /* ---------- Avatars (client photo) ---------- */
  .avatar{border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;color:#0d0e12;object-fit:cover;overflow:hidden;line-height:1}
  .photo-picker{display:flex;align-items:center;gap:14px}
  .avatar-pick{width:58px;height:58px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:20px;color:#0d0e12;background:var(--surface-3);
    border:2px dashed var(--border);cursor:pointer;transition:.14s}
  .avatar-pick:hover{border-color:var(--accent-dim)}
  .avatar-pick.has-photo{border-style:solid;border-color:var(--border)}
  .avatar-pick img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-picker-actions{display:flex;flex-direction:column;gap:6px}

  /* ---------- Tasks ---------- */
  .task{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;transition:.12s;
    box-shadow:0 1px 2px rgba(0,0,0,.16)}
  .task:hover{border-color:var(--border);background:var(--surface-2)}
  .check{width:19px;height:19px;border:1.8px solid var(--muted-2);border-radius:6px;flex-shrink:0;
    display:grid;place-items:center;transition:.12s}
  .check:hover{border-color:var(--accent)}
  .task.done .check{background:var(--accent-grad);border-color:var(--accent)}
  .task.done .check svg{opacity:1}
  .check svg{opacity:0;color:#0d0e12}
  .task-txt{flex:1;min-width:0;font-size:14px}
  .task.done .task-txt{color:var(--muted-2);text-decoration:line-through}
  .task-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .prio{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.02em}
  .prio.alta{background:rgba(229,105,138,.14);color:var(--danger)}
  .prio.media{background:rgba(230,180,95,.14);color:var(--warn)}
  .prio.baixa{background:rgba(95,208,160,.12);color:var(--ok)}

  /* ---------- Approvals (kanban) ---------- */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;min-height:120px;box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .col h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
    margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .col h3 .n{margin-left:auto;background:var(--surface-3);color:var(--muted);font-size:11px;padding:0 7px;border-radius:20px}
  .col h3 .sdot{width:8px;height:8px;border-radius:50%}
  .card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:10px 11px;margin-bottom:8px;cursor:grab}
  .card:active{cursor:grabbing}
  .card.drag{opacity:.4}
  .col.over{border-color:var(--accent-dim);background:var(--surface-2)}
  .card-t{font-size:13px;font-weight:500;margin-bottom:7px;line-height:1.35}
  .card-b{display:flex;align-items:center;justify-content:space-between;gap:8px}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .cal-head h3{font-family:var(--display);font-size:18px;font-weight:600;text-transform:capitalize;min-width:170px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;padding:4px 0;font-weight:600}
  .cal-day{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
    min-height:96px;padding:7px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:4px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .cal-day:hover{border-color:var(--accent-dim)}
  .cal-day.out{opacity:.32}
  .cal-day .dn{font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
  .cal-day.today .dn{color:var(--accent);font-weight:700}
  .cal-day.today{border-color:var(--accent-dim)}
  .ev{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--surface-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
  .ev .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .ev-more{font-size:10px;color:var(--muted-2)}
  .ev-note{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--accent-ghost);color:var(--accent);
    font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Links ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .link{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 15px 15px 17px;
    display:block;color:var(--text);text-decoration:none;transition:.14s;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.16)}
  .link::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lcolor,var(--accent))}
  .link:hover{border-color:var(--accent-dim);transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
  .link .lt{font-size:14.5px;font-weight:600;color:#fff;margin-bottom:4px;padding-right:44px}
  .link .lu{font-size:11.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link .lactions{position:absolute;top:9px;right:9px;display:flex;gap:2px;opacity:0;transition:.12s}
  .link:hover .lactions{opacity:1}
  .link .ltag{margin-top:10px}

  /* ---------- Sheet (spreadsheet) ---------- */
  .sheet-owner{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--muted)}
  .sheet-owner .ctag{font-size:12px}
  .sheet-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:auto;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.16)}
  .sheet{border-collapse:collapse;width:100%}
  .sheet th,.sheet td{border:1px solid var(--border-soft);padding:0;min-width:130px}
  .sheet thead th{background:var(--surface-2);position:sticky;top:0;z-index:2;text-align:left}
  .sheet .rownum{width:38px;min-width:38px;text-align:center;color:var(--muted-2);font-size:11px;
    background:var(--surface-2);position:relative;user-select:none}
  .sheet .rownum .rowdel{position:absolute;inset:0;display:none;place-items:center;background:var(--surface-2)}
  .sheet tr:hover .rownum .rowdel{display:grid}
  .sheet tr:hover .rownum .rn{visibility:hidden}
  .sheet thead .rownum{background:var(--surface-3)}
  .sheet .colhead{display:flex;align-items:center;gap:2px}
  .sheet .colhead .cell{flex:1;font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--text)}
  .sheet .colhead .coldel{opacity:0;transition:.12s;flex-shrink:0;margin-right:4px}
  .sheet thead th:hover .coldel{opacity:1}
  .sheet .cell{padding:7px 10px;min-height:34px;outline:none;font-size:13px;color:var(--text);
    white-space:pre-wrap;word-break:break-word;cursor:text}
  .sheet .cell:focus{background:var(--accent-ghost);box-shadow:inset 0 0 0 1.5px var(--accent-dim)}
  .sheet tbody tr:nth-child(even) td{background:rgba(255,255,255,.012)}

  /* ---------- Files (Dados archive) ---------- */
  .grid-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .file-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.16);transition:.14s;display:flex;flex-direction:column}
  .file-card:hover{border-color:var(--accent-dim);transform:translateY(-2px)}
  .file-open{display:block;color:var(--text);text-decoration:none}
  .file-thumb{width:100%;height:104px;object-fit:cover;display:block;background:var(--surface-2)}
  .file-icon{width:100%;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:7px;background:var(--surface-2);color:var(--muted-2)}
  .file-icon .ext{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.04em;
    background:var(--surface-3);color:var(--text);padding:2px 8px;border-radius:5px}
  .file-name{font-size:12.5px;font-weight:600;color:#fff;padding:10px 10px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file-meta{font-size:10.5px;color:var(--muted-2);padding:0 10px 10px}
  .file-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-top:1px solid var(--border-soft)}
  .file-foot .ctag{font-size:10px}

  /* ---------- Goals ---------- */
  .goal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.16)}
  .goal-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .goal-h .gt{font-size:14.5px;font-weight:600}
  .goal-h .gp{margin-left:auto;font-family:var(--display);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .bar{height:8px;background:var(--surface-3);border-radius:20px;overflow:hidden;margin-bottom:12px}
  .bar i{display:block;height:100%;border-radius:20px;background:var(--accent-grad);transition:width .4s ease}
  .goal-ctrl{display:flex;align-items:center;gap:8px}
  .goal-ctrl input[type=range]{flex:1;accent-color:var(--accent);padding:0}

  /* ---------- Focus / Pomodoro ---------- */
  .pomo{max-width:400px;margin:20px auto;text-align:center}
  .timer{font-family:var(--display);font-size:82px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0}
  .pomo-modes{display:flex;gap:8px;justify-content:center;margin-bottom:26px}
  .pmode{padding:8px 16px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);
    font-size:13px;font-weight:500;color:var(--muted);transition:.12s}
  .pmode.active{background:var(--accent-ghost);color:var(--text);border-color:var(--accent-dim)}
  .ring{position:relative;width:220px;height:220px;margin:0 auto 24px}
  .ring svg{transform:rotate(-90deg)}
  .ring .rc{fill:none;stroke:var(--surface-3);stroke-width:8}
  .ring .rp{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear}

  /* ---------- Modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(6,7,10,.7);backdrop-filter:blur(3px);z-index:50;

  .modal.lg{max-width:660px;max-height:88vh;overflow-y:auto}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .modal h3{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:16px}

  .modal-foot{display:flex;gap:10px;margin-top:20px}

  .modal-sec{font-family:var(--display);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;

  .modal-sec:first-of-type{margin-top:18px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .palette-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;min-height:28px}

  .pal-chip:hover button{opacity:1}

  .day-ev-list{margin-bottom:14px;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
  .day-ev{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);border-radius:var(--radius-sm);font-size:13px}
  .day-ev .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .day-ev span{flex:1}

  @media(max-width:820px){
    body{flex-direction:column}
    .rail{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;align-items:center;border-right:none;border-bottom:1px solid var(--border)}
    .brand{padding:12px 14px;border-right:1px solid var(--border-soft)}

    .content{padding:16px}

  }
  @media(max-width:560px){.board{grid-template-columns:1fr}}
</style>

<script>
/* ============ FIREBASE (shared storage) ============
   1. Crie um projeto em https://console.firebase.google.com
   2. Adicione um "Web App" e copie o objeto de config para baixo.
   3. Ative Firestore Database e Authentication > Sign-in method > Anonymous.
   4. Nas regras do Firestore, use algo como:
      match /smcentral/{doc} { allow read, write: if request.auth != null; }
*/
const firebaseConfig = {
  apiKey: "AIzaSyBQ6KTj9mS0JM-x3T13n3uwo1KA6YJwSYk",
  authDomain: "maltaapp-bfb09.firebaseapp.com",
  projectId: "maltaapp-bfb09",
  storageBucket: "maltaapp-bfb09.firebasestorage.app",
  messagingSenderId: "967633929471",
  appId: "1:967633929471:web:5c00e77db61587276838ca",
  measurementId: "G-10BYF83PL3"
};
const firebaseEnabled = firebaseConfig.apiKey !== "COLE_AQUI";
let db=null, docRef=null, applyingRemote=false, saveTimer=null;
if(firebaseEnabled){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  docRef = db.collection('smcentral').doc('shared');
}

/* ============ STATE ============ */
const PALETTE = ['#7c8cf8','#5fd0a0','#e6b45f','#e5698a','#6fc4e6','#c07ef0','#e6845f','#8bd05f'];
const DEFAULT = {
  clients:[], tasks:[], appr:[], events:{}, goals:[], links:[], files:[], dayNotes:{},
  sheets:{},
  activeClient:'all', activeView:'tasks', pCount:0, pDate:'',
  calYear:new Date().getFullYear(), calMonth:new Date().getMonth()
};
let S = load();
/* migrate old single shared sheet (pre-client-split) into the "Geral" slot */
if(S.sheet){ if(!S.sheets['all']) S.sheets['all']=S.sheet; delete S.sheet; save(); }

function load(){
  try{ const r = JSON.parse(localStorage.getItem('smcentral')); return r?{...DEFAULT,...r}:{...DEFAULT}; }
  catch(e){ return {...DEFAULT}; }
}
function save(){
  localStorage.setItem('smcentral', JSON.stringify(S));
  if(!firebaseEnabled || applyingRemote) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ docRef.set({data:JSON.stringify(S)}).catch(e=>console.error('Erro ao sincronizar:', e)); }, 400);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* seed a couple clients on first run */
if(!firebaseEnabled && S.clients.length===0){
  S.clients=[{id:uid(),name:'Cliente A',color:PALETTE[0]},{id:uid(),name:'Cliente B',color:PALETTE[1]}];
  save();
}

async function initSync(){
  if(!firebaseEnabled) return;
  await firebase.auth().signInAnonymously();
  docRef.onSnapshot({includeMetadataChanges:true}, snap=>{
    if(snap.metadata.hasPendingWrites) return; // eco da própria escrita local
    if(!snap.exists){
      if(S.clients.length===0){
        S.clients=[{id:uid(),name:'Cliente A',color:PALETTE[0]},{id:uid(),name:'Cliente B',color:PALETTE[1]}];
      }
      docRef.set({data:JSON.stringify(S)}).catch(e=>console.error('Erro ao criar documento:', e));
      return;
    }
    let remote;
    try{ remote = {...DEFAULT, ...JSON.parse(snap.data().data)}; }
    catch(e){ console.error('Documento remoto inválido:', e); return; }
    if(JSON.stringify(remote)===JSON.stringify(S)) return;
    applyingRemote = true;
    S = remote;
    localStorage.setItem('smcentral', JSON.stringify(S));
    renderAll(); renderBadges(); paintTimer();
    applyingRemote = false;
  }, e=>console.error('Erro ao sincronizar:', e));
}

function clientById(id){ return S.clients.find(c=>c.id===id); }
function clientAvatar(id,size){
  const c=clientById(id);
  const fs=Math.max(9,Math.round(size*.5));
  if(!c) return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${fs}px;background:var(--surface-3)"></span>`;
  if(c.photo) return `<img class="avatar" src="${c.photo}" alt="" style="width:${size}px;height:${size}px">`;
  return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${fs}px;background:${c.color}">${esc((c.name.trim()[0]||'?').toUpperCase())}</span>`;
}
function clientDot(id){ return clientAvatar(id,15); }
function clientTag(id){ const c=clientById(id); if(!c) return ''; return `<span class="ctag">${clientAvatar(id,16)}${esc(c.name)}</span>`; }
function matchClient(id){ return S.activeClient==='all' || id===S.activeClient; }
function currentClientForNew(){ return S.activeClient==='all' ? (S.clients[0]?.id||null) : S.activeClient; }

/* ============ NAV / VIEWS ============ */
const VIEWS={
  clients:['Clientes','Perfil completo de cada conta'],
  tasks:['Tarefas','O que precisa sair hoje'],
  approvals:['Aprovações','Status de cada post — arraste entre as colunas'],
  calendar:['Calendário','Planejamento e agendamentos'],
  goals:['Metas','Progresso das campanhas'],
  links:['Links rápidos','Seus atalhos de trabalho'],
  sheet:['Planilha','Uma planilha independente para cada cliente'],
  files:['Dados','Arquive fotos, PDFs e documentos por cliente'],
  focus:['Foco','Um ciclo de cada vez']
};
document.querySelectorAll('.nav-item').forEach(b=>{
  b.onclick=()=>switchView(b.dataset.view);
});
function switchView(v){
  S.activeView=v; save();
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='v-'+v));
  document.getElementById('viewTitle').textContent=VIEWS[v][0];
  document.getElementById('viewSub').textContent=VIEWS[v][1];
}

/* ============ CLIENT PILLS ============ */
function renderClients(){
  const el=document.getElementById('clients');
  let h=`<button class="cpill ${S.activeClient==='all'?'active':''}" onclick="setClient('all')">
    <span class="dot" style="background:var(--accent-grad)"></span>Todos</button>`;
  S.clients.forEach(c=>{
    h+=`<button class="cpill ${S.activeClient===c.id?'active':''}" onclick="setClient('${c.id}')" ondblclick="editClient('${c.id}')" title="Duplo clique para editar">
      ${clientAvatar(c.id,20)}${esc(c.name)}</button>`;
  });
  h+=`<button class="cpill add" onclick="openClientModal()">+ Cliente</button>`;
  el.innerHTML=h;
  renderClientGrid();
}
function renderClientGrid(){
  const el=document.getElementById('clientGrid'); if(!el) return;
  if(!S.clients.length){ el.innerHTML=empty('Nenhum cliente cadastrado','Adicione o primeiro cliente para começar a organizar tudo por conta.'); return; }
  el.innerHTML=S.clients.map(c=>{
    const credCount=(c.credentials||[]).length;
    const palette=(c.palette||[]).slice(0,8).map(hex=>`<span class="pal-sw" style="background:${hex}" title="${esc(hex)}"></span>`).join('');
    const chips=[
      c.contact?.name?`<span class="ccard-chip">Contato: ${esc(c.contact.name)}</span>`:'',
      c.contact?.email?`<span class="ccard-chip">${esc(c.contact.email)}</span>`:'',
      c.contact?.phone?`<span class="ccard-chip">${esc(c.contact.phone)}</span>`:'',
      credCount?`<span class="ccard-chip">${credCount} credencial${credCount>1?'is':''} salva${credCount>1?'s':''}</span>`:''
    ].filter(Boolean).join('');
    return `<div class="client-card" onclick="viewClient('${c.id}')">
      <div class="ccard-head">
        ${clientAvatar(c.id,52)}
        <div class="ccard-id">
          <div class="ccard-name">${esc(c.name)}</div>
          ${c.objective?`<div class="ccard-obj" title="${esc(c.objective)}">${esc(c.objective)}</div>`:''}
        </div>
        <button class="iconbtn edit" onclick="event.stopPropagation();editClient('${c.id}')" title="Editar perfil"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      </div>
      ${c.description?`<div class="ccard-desc">${esc(c.description)}</div>`:''}
      ${palette?`<div class="ccard-palette">${palette}</div>`:''}
      ${chips?`<div class="ccard-foot">${chips}</div>`:''}
    </div>`;
  }).join('');
}
function setClient(id){ S.activeClient=id; save(); renderAll(); }

/* ============ TASKS ============ */
function addTask(){
  const i=document.getElementById('taskInput'); const t=i.value.trim(); if(!t)return;
  S.tasks.unshift({id:uid(),text:t,prio:document.getElementById('taskPrio').value,done:false,client:currentClientForNew()});
  i.value=''; save(); renderTasks(); renderBadges();
}
function toggleTask(id){ const t=S.tasks.find(x=>x.id===id); t.done=!t.done; save(); renderTasks(); renderBadges(); }
function delTask(id){ S.tasks=S.tasks.filter(x=>x.id!==id); save(); renderTasks(); renderBadges(); }
function renderTasks(){
  const list=S.tasks.filter(t=>matchClient(t.client));
  const el=document.getElementById('taskList');
  if(!list.length){ el.innerHTML=empty('Nenhuma tarefa por aqui','Adicione a primeira acima para começar o dia.'); return; }
  const order={alta:0,media:1,baixa:2}; const plabel={alta:'Alta',media:'Média',baixa:'Baixa'};
  list.sort((a,b)=>(a.done-b.done)||(order[a.prio]-order[b.prio]));

const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function calMove(d){ S.calMonth+=d; if(S.calMonth<0){S.calMonth=11;S.calYear--} if(S.calMonth>11){S.calMonth=0;S.calYear++} save(); renderCal(); }
function calToday(){ const n=new Date(); S.calYear=n.getFullYear(); S.calMonth=n.getMonth(); save(); renderCal(); }
function dkey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function renderCal(){
  document.getElementById('calDow').innerHTML=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  document.getElementById('calLabel').textContent=`${MONTHS[S.calMonth]} ${S.calYear}`;
  const first=new Date(S.calYear,S.calMonth,1).getDay();
  const days=new Date(S.calYear,S.calMonth+1,0).getDate();
  const prevDays=new Date(S.calYear,S.calMonth,0).getDate();
  const today=new Date(); const tk=dkey(today.getFullYear(),today.getMonth(),today.getDate());
  let cells=[];
  for(let i=first-1;i>=0;i--) cells.push({d:prevDays-i,out:true});
  for(let d=1;d<=days;d++) cells.push({d,out:false});
  while(cells.length%7!==0) cells.push({d:cells.length-(first+days)+1,out:true});
  document.getElementById('calGrid').innerHTML=cells.map(c=>{
    if(c.out) return `<div class="cal-day out"><div class="dn">${c.d}</div></div>`;
    const key=dkey(S.calYear,S.calMonth,c.d);
    const evs=(S.events[key]||[]).filter(e=>matchClient(e.client));
    const shown=evs.slice(0,3).map(e=>`<div class="ev">${clientDot(e.client)}${esc(e.text)}</div>`).join('');
    const more=evs.length>3?`<div class="ev-more">+${evs.length-3} mais</div>`:'';
    const note=S.dayNotes[key]?`<div class="ev-note" title="${esc(S.dayNotes[key])}">${esc(S.dayNotes[key])}</div>`:'';
    return `<div class="cal-day ${key===tk?'today':''}" onclick="openDayModal('${key}')"><div class="dn">${c.d}</div>${note}${shown}${more}</div>`;
  }).join('');
}

function sheetCellKey(e){
  if(e.key==='Enter'){
    e.preventDefault();
    const row=e.target.dataset.row, col=e.target.dataset.col;
    e.target.blur();
    if(row!==undefined){
      let next=document.querySelector(`.cell[data-row="${+row+1}"][data-col="${col}"]`);
      if(!next){ addSheetRow(); next=document.querySelector(`.cell[data-row="${+row+1}"][data-col="${col}"]`); }
      if(next) focusCell(next);
    }
  }else if(e.key==='Escape'){ e.target.blur(); }
}

/* ============ FILES (Dados archive) ============ */
function humanSize(bytes){
  if(bytes<1024) return bytes+' B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}
function fileExt(name){ const m=(name||'').match(/\.([a-zA-Z0-9]+)$/); return m?m[1].toUpperCase():'ARQ'; }
function readAsDataURL(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(file); }); }
function compressImage(file,maxDim,quality){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ const r=Math.min(maxDim/w,maxDim/h); w=Math.round(w*r); h=Math.round(h*r); }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function triggerFileUpload(){ document.getElementById('fileUploadInput').click(); }
async function handleFileUpload(e){
  const files=[...e.target.files]; e.target.value='';
  const cl=currentClientForNew();
  let failed=false;
  for(const f of files){
    const dataUrl = f.type.startsWith('image/') ? await compressImage(f,1600,.82) : await readAsDataURL(f);
    const size = Math.round(dataUrl.length*.75);
    const entry={id:uid(),name:f.name,type:f.type,size,data:dataUrl,client:cl,date:Date.now()};
    S.files.unshift(entry);
    try{ save(); } catch(err){ S.files.shift(); failed=true; }
  }
  renderFiles();
  if(failed) alert('Alguns arquivos não couberam no armazenamento local do navegador (limite de poucos MB). Remova arquivos antigos ou envie imagens/PDFs menores.');
}
function delFile(id){ S.files=S.files.filter(x=>x.id!==id); save(); renderFiles(); }
function renderFiles(){
  const list=S.files.filter(f=>matchClient(f.client));
  const el=document.getElementById('fileGrid');
  if(!list.length){ el.innerHTML=empty('Nenhum arquivo arquivado','Envie fotos, PDFs e outros documentos para guardar aqui.'); return; }
  el.innerHTML=list.map(f=>{
    const isImg=f.type.startsWith('image/');
    const thumb=isImg?`<img class="file-thumb" src="${f.data}" alt="">`:`<div class="file-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><span class="ext">${fileExt(f.name)}</span></div>`;
    return `<div class="file-card">
      <a class="file-open" href="${f.data}" download="${esc(f.name)}" target="_blank" rel="noopener">
        ${thumb}
        <div class="file-name" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="file-meta">${humanSize(f.size)} · ${new Date(f.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</div>
      </a>
      <div class="file-foot">
        ${clientTag(f.client)||'<span class="ctag">Geral</span>'}
        <button class="iconbtn del" onclick="delFile('${f.id}')" title="Excluir">${XSVG}</button>
      </div>
    </div>`;
  }).join('');
}


/* ============ POMODORO ============ */
let pTotal=25*60, pLeft=25*60, pRun=false, pTick=null, pMode=25;
const RC=2*Math.PI*100;
document.getElementById('ring').style.strokeDasharray=RC;
function fmt(s){ return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function paintTimer(){
  document.getElementById('timer').textContent=fmt(pLeft);
  document.getElementById('ring').style.strokeDashoffset=RC*(1-pLeft/pTotal);
}
function setMode(min,btn){
  pMode=min; pTotal=min*60; pLeft=min*60; pRun=false; clearInterval(pTick);
  document.getElementById('pStart').textContent='Iniciar';
  document.getElementById('pstatus').textContent='Pronto';
  document.querySelectorAll('.pmode').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  paintTimer();
}
function toggleTimer(){
  if(pRun){ pRun=false; clearInterval(pTick); document.getElementById('pStart').textContent='Continuar'; document.getElementById('pstatus').textContent='Pausado'; return; }
  pRun=true; document.getElementById('pStart').textContent='Pausar'; document.getElementById('pstatus').textContent='Em andamento';
  pTick=setInterval(()=>{
    pLeft--; paintTimer();
    if(pLeft<=0){
      clearInterval(pTick); pRun=false;
      document.getElementById('pStart').textContent='Iniciar';
      document.getElementById('pstatus').textContent='Concluído';
      if(pMode>=15||pMode===25){} // count focus sessions only
      if(pMode===25){ checkDay(); S.pCount++; save(); document.getElementById('pCount').textContent=S.pCount; }
      try{ new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); }catch(e){}
      alert(pMode===25?'Ciclo de foco concluído! Faça uma pausa.':'Pausa encerrada. Bora voltar!');
    }
  },1000);
}
function resetTimer(){ pRun=false; clearInterval(pTick); pLeft=pTotal; document.getElementById('pStart').textContent='Iniciar'; document.getElementById('pstatus').textContent='Pronto'; paintTimer(); }

    ${photoPickerField()}
    <div class="field"><label>Nome</label><input id="mCName" placeholder="Ex.: Padaria do Zé" value="${c?esc(c.name):''}" oninput="refreshPhotoPreview()"></div>
    <div class="field"><label>Cor de identificação</label><div class="swatches">${swatchRow(pickColor)}</div></div>

    <div class="modal-sec">Sobre o cliente</div>
    <div class="field"><label>Descrição</label><textarea id="mCDesc" rows="2" placeholder="Quem é o cliente, ramo de atuação, tom de voz...">${c?esc(c.description||''):''}</textarea></div>
    <div class="field"><label>Objetivo</label><textarea id="mCObj" rows="2" placeholder="O que queremos alcançar com esse cliente...">${c?esc(c.objective||''):''}</textarea></div>

    <div class="modal-sec">Paleta de cores da marca</div>
    <div class="field">
      <div class="palette-row" id="paletteRow"></div>
      <div class="palette-add">
        <input type="color" id="paletteColorInput" value="#7c8cf8">
        <button type="button" class="btn ghost sm" onclick="addPaletteColor()">+ Adicionar cor</button>
      </div>
    </div>

    <div class="modal-sec">Dados de contato</div>
    <div class="field-row">
      <div class="field"><label>Contato</label><input id="mCContactName" value="${esc(c?.contact?.name||'')}" placeholder="Nome do responsável"></div>
      <div class="field"><label>Telefone</label><input id="mCContactPhone" value="${esc(c?.contact?.phone||'')}" placeholder="(00) 00000-0000"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>E-mail</label><input id="mCContactEmail" value="${esc(c?.contact?.email||'')}" placeholder="contato@cliente.com"></div>
      <div class="field"><label>Endereço</label><input id="mCContactAddr" value="${esc(c?.contact?.address||'')}" placeholder="Cidade / endereço"></div>
    </div>

    <div class="modal-sec">Credenciais e senhas</div>
    <div class="field">
      <div id="credList"></div>
      <button type="button" class="btn ghost sm" onclick="addCredRow()">+ Nova credencial</button>
      <div class="cred-hint">Salvo apenas neste navegador, sem criptografia — evite usar para contas muito sensíveis.</div>
    </div>
  `;
}
function initClientModalExtras(c){
  pickPalette = c?.palette ? [...c.palette] : [];
  pickCredentials = c?.credentials ? c.credentials.map(x=>({...x})) : [];
  renderPaletteChips(); renderCredRows();
}
function collectClientFields(){
  return {
    name: document.getElementById('mCName').value.trim(),
    description: document.getElementById('mCDesc').value.trim(),
    objective: document.getElementById('mCObj').value.trim(),
    contact:{
      name: document.getElementById('mCContactName').value.trim(),
      phone: document.getElementById('mCContactPhone').value.trim(),
      email: document.getElementById('mCContactEmail').value.trim(),
      address: document.getElementById('mCContactAddr').value.trim()
    },
    palette:[...pickPalette],
    credentials: pickCredentials.filter(x=>x.label||x.user||x.pass).map(x=>({id:x.id||uid(),label:x.label,user:x.user,pass:x.pass}))
  };
}

function openClientModal(){
  pickColor=PALETTE[S.clients.length%PALETTE.length]; pickPhoto=null;
  mBox.classList.add('lg');
  mBox.innerHTML=`<h3>Novo cliente</h3>
    ${clientModalBody(null)}
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveClient()">Adicionar</button></div>`;
  mBg.classList.add('open'); initClientModalExtras(null);
  setTimeout(()=>{document.getElementById('mCName').focus(); refreshPhotoPreview();},50);
}
function saveClient(){
  const f=collectClientFields(); if(!f.name)return;
  S.clients.push({id:uid(),color:pickColor,photo:pickPhoto,...f}); save(); closeModal(); renderClients();
}

let viewCreds=[];
function viewClient(id){
  const c=clientById(id); if(!c)return;
  viewCreds=c.credentials||[];
  const palette=(c.palette||[]).map(hex=>`<span class="pal-sw" style="width:22px;height:22px;background:${hex}" title="${esc(hex)}"></span>`).join('');
  const hasContact=c.contact&&(c.contact.name||c.contact.email||c.contact.phone||c.contact.address);
  mBox.classList.add('lg');
  mBox.innerHTML=`
    <div class="view-head">
      ${clientAvatar(c.id,60)}
      <div>
        <h3 style="margin-bottom:2px">${esc(c.name)}</h3>
        ${c.objective?`<div class="view-obj">${esc(c.objective)}</div>`:''}
      </div>
    </div>
    ${c.description?`<div class="modal-sec">Descrição</div><div class="view-text">${esc(c.description)}</div>`:''}
    ${palette?`<div class="modal-sec">Paleta de cores</div><div class="palette-row">${palette}</div>`:''}
    ${hasContact?`<div class="modal-sec">Contato</div><div class="view-list">
        ${c.contact.name?`<div><b>Responsável:</b> ${esc(c.contact.name)}</div>`:''}
        ${c.contact.phone?`<div><b>Telefone:</b> ${esc(c.contact.phone)}</div>`:''}
        ${c.contact.email?`<div><b>E-mail:</b> ${esc(c.contact.email)}</div>`:''}
        ${c.contact.address?`<div><b>Endereço:</b> ${esc(c.contact.address)}</div>`:''}
      </div>`:''}
    ${viewCreds.length?`<div class="modal-sec">Credenciais e senhas</div>
      <div>${viewCreds.map((cr,i)=>`
        <div class="cred-view-row">
          <span class="cv-label">${esc(cr.label||'—')}</span>
          <span class="cv-user">${esc(cr.user||'—')}</span>
          <span class="cv-pass" id="cvp${i}">••••••••</span>
          <button type="button" class="iconbtn" onclick="toggleViewCredPass(${i})" title="Mostrar/ocultar senha">${EYESVG}</button>
        </div>`).join('')}</div>`:''}
    ${(!c.description&&!palette&&!hasContact&&!viewCreds.length)?`<div class="view-text">Nenhuma informação adicional cadastrada ainda. Clique em "Editar" para completar o perfil.</div>`:''}
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn" onclick="editClient('${id}')">Editar</button></div>`;
  mBg.classList.add('open');
}
function toggleViewCredPass(i){
  const el=document.getElementById('cvp'+i); if(!el)return;
  const cr=viewCreds[i]; if(!cr)return;
  if(el.dataset.shown==='1'){ el.textContent='••••••••'; el.dataset.shown='0'; }
  else{ el.textContent=cr.pass||'(vazio)'; el.dataset.shown='1'; }
}

function editClient(id){
  const c=clientById(id); if(!c)return; pickColor=c.color; pickPhoto=c.photo||null;
  mBox.classList.add('lg');
  mBox.innerHTML=`<h3>Editar cliente</h3>
    ${clientModalBody(c)}
    <div class="modal-foot"><button class="btn ghost" onclick="removeClient('${id}')" style="background:rgba(229,105,138,.14);color:var(--danger);border-color:transparent">Excluir</button><button class="btn" onclick="updateClient('${id}')">Salvar</button></div>`;
  mBg.classList.add('open'); initClientModalExtras(c);
  setTimeout(refreshPhotoPreview,0);
}
function updateClient(id){
  const c=clientById(id); const f=collectClientFields();
  c.name=f.name||c.name; c.color=pickColor; c.photo=pickPhoto;
  c.description=f.description; c.objective=f.objective; c.contact=f.contact; c.palette=f.palette; c.credentials=f.credentials;
  save(); closeModal(); renderAll();
}
function removeClient(id){
  if(!confirm('Excluir este cliente? Tarefas, links e outros itens ligados a ele continuam salvos, mas sem etiqueta. A planilha exclusiva desse cliente será apagada.'))return;
  S.clients=S.clients.filter(c=>c.id!==id); delete S.sheets[id];
  if(S.activeClient===id)S.activeClient='all'; save(); closeModal(); renderAll();
}

function linkClientOpts(sel){
  return `<option value="">Geral (todos os clientes)</option>` +
    S.clients.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
}
function openLinkModal(){
  pickColor=PALETTE[S.links.length%PALETTE.length];
  const defClient=currentClientForNew()||'';
  mBox.innerHTML=`<h3>Novo link</h3>
    <div class="field"><label>Nome</label><input id="mLName" placeholder="Ex.: Meta Business Suite"></div>
    <div class="field"><label>Endereço (URL)</label><input id="mLUrl" placeholder="https://..."></div>
    <div class="field"><label>Cliente</label><select id="mLClient">${linkClientOpts(defClient)}</select></div>
    <div class="field"><label>Cor</label><div class="swatches">${swatchRow(pickColor)}</div></div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveLink()">Adicionar</button></div>`;
  mBg.classList.add('open'); setTimeout(()=>document.getElementById('mLName').focus(),50);
}
function saveLink(){
  const n=document.getElementById('mLName').value.trim(); let u=document.getElementById('mLUrl').value.trim();
  const cl=document.getElementById('mLClient').value||null;
  if(!n||!u)return; if(!/^https?:\/\//.test(u)) u='https://'+u;
  S.links.push({id:uid(),name:n,url:u,color:pickColor,client:cl}); save(); closeModal(); renderLinks();
}
function editLink(id){
  const l=S.links.find(x=>x.id===id); if(!l)return; pickColor=l.color;
  mBox.innerHTML=`<h3>Editar link</h3>
    <div class="field"><label>Nome</label><input id="mLName" value="${esc(l.name)}"></div>
    <div class="field"><label>Endereço (URL)</label><input id="mLUrl" value="${esc(l.url)}"></div>
    <div class="field"><label>Cliente</label><select id="mLClient">${linkClientOpts(l.client)}</select></div>
    <div class="field"><label>Cor</label><div class="swatches">${swatchRow(pickColor)}</div></div>
    <div class="modal-foot"><button class="btn ghost" onclick="removeLink('${id}')" style="background:rgba(229,105,138,.14);color:var(--danger);border-color:transparent">Excluir</button><button class="btn" onclick="updateLink('${id}')">Salvar</button></div>`;
  mBg.classList.add('open'); setTimeout(()=>document.getElementById('mLName').focus(),50);
}
function updateLink(id){
  const l=S.links.find(x=>x.id===id); if(!l)return;
  const n=document.getElementById('mLName').value.trim(); let u=document.getElementById('mLUrl').value.trim();
  if(!n||!u)return; if(!/^https?:\/\//.test(u)) u='https://'+u;
  l.name=n; l.url=u; l.color=pickColor; l.client=document.getElementById('mLClient').value||null;
  save(); closeModal(); renderLinks();
}
function removeLink(id){ S.links=S.links.filter(x=>x.id!==id); save(); closeModal(); renderLinks(); }

function openDayModal(key){
  const [y,m,d]=key.split('-');
  const label=`${d} de ${MONTHS[+m-1]}`;
  const evs=S.events[key]||[];
  const opts=S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  mBox.innerHTML=`<h3>${label}</h3>
    ${evs.length?`<div class="day-ev-list">${evs.map((e,i)=>`<div class="day-ev">${clientDot(e.client)}<span>${esc(e.text)}</span><button class="iconbtn del" onclick="delEvent('${key}',${i})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`).join('')}</div>`:''}
    <div class="field"><label>Novo agendamento</label><input id="mEvText" placeholder="Ex.: Post feed + stories" onkeydown="if(event.key==='Enter')saveEvent('${key}')"></div>
    <div class="field"><label>Cliente</label><select id="mEvClient">${opts||'<option>—</option>'}</select></div>
    <div class="modal-sec">Comentário do dia</div>
    <div class="field"><textarea id="mDayNote" rows="3" placeholder="Anotação livre para esse dia..." onblur="saveDayNote('${key}',this.value)">${esc(S.dayNotes[key]||'')}</textarea></div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Fechar</button><button class="btn" onclick="saveEvent('${key}')">Agendar</button></div>`;
  mBg.classList.add('open'); setTimeout(()=>document.getElementById('mEvText').focus(),50);
}
function saveEvent(key){
  const t=document.getElementById('mEvText').value.trim(); if(!t)return;
  const cl=document.getElementById('mEvClient').value;
  if(!S.events[key])S.events[key]=[]; S.events[key].push({text:t,client:cl});
  save(); openDayModal(key); renderCal();
}
function saveDayNote(key,val){
  const v=val.trim();
  if(v) S.dayNotes[key]=v; else delete S.dayNotes[key];
  save(); renderCal();
}
function delEvent(key,i){ S.events[key].splice(i,1); if(!S.events[key].length)delete S.events[key]; save(); openDayModal(key); renderCal(); }

/* ============ HELPERS ============ */
function empty(title,sub){ return `<div class="empty"><b>${title}</b>${sub}</div>`; }
function renderBadges(){
  document.getElementById('b-tasks').textContent=S.tasks.filter(t=>!t.done&&matchClient(t.client)).length;
  document.getElementById('b-appr').textContent=S.appr.filter(a=>a.stage!=='publicado'&&matchClient(a.client)).length;
  document.getElementById('b-goals').textContent=S.goals.filter(g=>matchClient(g.client)).length;
}
function renderAll(){
  renderClients(); renderTasks(); renderBoard(); renderCal(); renderGoals();
  renderLinks(); renderSheet(); renderFiles(); renderBadges();
}

/* ============ CLOCK ============ */
function tickClock(){
  const n=new Date();
  document.getElementById('clkDate').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
  document.getElementById('clkTime').textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

/* ============ RESET ============ */
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Isso apaga tudo (clientes, tarefas, calendário...) para todo mundo. Não dá pra desfazer. Continuar?')){
    localStorage.removeItem('smcentral');
    if(firebaseEnabled) docRef.delete().finally(()=>location.reload());
    else location.reload();
  }
};

/* ============ INIT ============ */
checkDay(); document.getElementById('pCount').textContent=S.pCount;
switchView(S.activeView||'tasks');
renderAll(); paintTimer(); tickClock(); setInterval(tickClock,10000);
initSync();
</script>
</body>
</html>
